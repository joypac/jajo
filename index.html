<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1430" />
<meta name="description" content="Um turno na loja das meias. A Andreia faz tudo. A Sónia não." />
<title>ANDREIA - A LOJA DAS MEIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%A7%A6</text></svg>">
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="ui">

      <!-- ===================== HUD ===================== -->
      <div id="hud" class="hidden">
        <div class="hud-top">
          <span id="hud-clock">09:00</span>
          <span id="hud-face" class="face">🙂</span>
        </div>
        <div class="hud-bars">
          <div class="hud-row"><span class="lbl">ENERGIA</span><span class="bar"><i id="bar-energia"></i></span></div>
          <div class="hud-row"><span class="lbl">LOJA</span><span class="bar tidy"><i id="bar-loja"></i></span><b id="txt-loja">100%</b></div>
        </div>
        <div id="hud-chips">
          <span class="chip" id="chip-stock">📦 0</span>
          <span class="chip" id="chip-chao">🧹 0</span>
          <span class="chip" id="chip-fila">🛍️ 0</span>
        </div>
      </div>

      <!-- lista da última hora -->
      <div id="tasklist" class="hidden">
        <header>FECHO</header>
        <ul id="tasklist-items"></ul>
      </div>

      <!-- balões no mundo -->
      <div id="bubbles"></div>

      <!-- avisos -->
      <div id="toasts"></div>

      <!-- diálogo rápido (cutscenes curtas) -->
      <div id="talk" class="hidden">
        <span id="talk-who"></span>
        <p id="talk-text"></p>
      </div>

      <!-- atendimento: 3 respostas rápidas -->
      <div id="serve" class="hidden">
        <div id="serve-q"></div>
        <div id="serve-opts"></div>
        <div id="serve-timer"><i></i></div>
      </div>

      <!-- caixa -->
      <div id="caixa" class="hidden">
        <header>FECHAR A CAIXA</header>
        <p id="caixa-step">Contar notas</p>
        <div id="caixa-opts"></div>
        <div id="caixa-prog"><i></i></div>
      </div>

      <!-- ===================== TÍTULO ===================== -->
      <div id="title" class="hidden">
        <div class="title-inner">
          <div class="title-sock">🧦</div>
          <h1><span class="t1">ANDREIA</span><span class="t2">A LOJA DAS MEIAS</span></h1>
          <p class="title-sub">Um turno. Muitos clientes. Poucas vendas.</p>
          <button id="btn-start" class="pixbtn">COMEÇAR O TURNO</button>
          <p class="title-hint">mover: wasd / setas &middot; acção: espaço</p>
        </div>
      </div>

      <!-- ===================== RESUMO ===================== -->
      <div id="summary" class="hidden">
        <div class="sum-inner">
          <h1 id="sum-title">RESUMO DO TURNO</h1>
          <div id="sum-rows"></div>
          <div id="sum-store"></div>
          <div id="sum-stars"></div>
          <p id="sum-verdict"></p>
          <button id="btn-again" class="pixbtn">OUTRO TURNO</button>
        </div>
      </div>

    </div><!-- /#ui -->

    <!-- ===================== CONTROLOS ===================== -->
    <div id="touch" class="hidden">
      <div id="stick"><span id="stick-knob"></span></div>
      <div id="abtns">
        <button id="btn-b" class="rbtn small">LARGAR</button>
        <button id="btn-a" class="rbtn">A</button>
      </div>
    </div>
    <button id="btn-sound" title="som">&#9835;</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
